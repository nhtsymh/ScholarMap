[project]
name = "scholarmap"
version = "0.2.0"
description = "Query-conditioned scholarly discovery and research landscape ranking"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "networkx>=3.3",
  "numpy>=2.0",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5"]

[project.scripts]
scholarmap = "scholarmap.cli:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scholarmap*"]

[tool.setuptools.package-data]
scholarmap = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
